services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:3000
      SIMULATOR_INTERVAL: "25"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # адрес API, как его видит БРАУЗЕР (запросы идут с клиента)
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
